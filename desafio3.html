
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu da Cafeteria</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            color: #493629;
            padding: 25px;
        }

        .menu {
            background-color: white;
            border: 2px solid #d8b99c;
            border-radius: 15px;
            padding: 20px;
            max-width: 550px;
        }

        h2 {
            color: #8b5e3c;
        }

        .antigo {
            color: #999;
        }

        .novo {
            color: #228b22;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu">
        <h2>☕ Cantinho do Café</h2>

        <p>Nossas bebidas:</p>

        <ul>
            <li>Café Americano</li>
            <li>
                Chocolate Quente
                <ul>
                    <li>Com leite sem lactose</li>
                    <li>Com leite de amêndoas</li>
                </ul>
            </li>
            <li>Macchiato</li>
        </ul>

        <h3>⭐ Os 3 favoritos dos clientes</h3>

        <ol reversed>
            <li>
                Café Mocha:
                <del class="antigo">R$ 18,00</del>
                <ins class="novo">R$ 14,00</ins>
            </li>
            <li>Frappé de Baunilha</li>
            <li>Latte de Caramelo</li>
        </ol>
    </div>

</body>
</html>
